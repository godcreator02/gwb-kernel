# electron-builder 正本。应用目录是装配出来的 build/app（gitignore），产物落 build/dist。
# **不写 electronVersion**——单一真源在 apps/desktop 的 devDependencies.electron，
# build.ps1 现读现经 --config.electronVersion 传进来，别在这里再钉一份。
# 安装包只带内核，不带任何插件：装机由 agent 照仓根 INSTALL.md 做
appId: online.tianshen02.gwb
productName: gwb-kernel
directories:
  app: build/app
  output: build/dist
files:
  - package.json
  - bootstrap.mjs
  - node_modules/**
win:
  icon: icons/icon.ico
  artifactName: gwb-portable-${version}.${ext}
  target:
    - nsis
    - zip
nsis:
  oneClick: true
  perMachine: false
  artifactName: gwb-setup-${version}.${ext}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
