# electron-builder 的配置。应用目录是 build.ps1 组装出来的 build/app（gitignore），产物在 build/dist。
# **不写 electronVersion**——版本只写在 apps/desktop 的 devDependencies.electron 里，
# build.ps1 读出来经 --config.electronVersion 传入，这里不再写一份。
# 安装包只带内核，不带任何插件：插件由 agent 照仓根 INSTALL.md 安装
appId: online.tianshen02.gwb
productName: gwb-kernel
directories:
  app: build/app
  output: build/dist
files:
  - package.json
  - bootstrap.mjs
  - node_modules/**
win:
  icon: icons/icon.ico
  artifactName: gwb-portable-${version}.${ext}
  target:
    - nsis
    - zip
nsis:
  oneClick: true
  perMachine: false
  artifactName: gwb-setup-${version}.${ext}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
