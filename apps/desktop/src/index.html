<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>gwb</title>
    <style>
      /* 与 main.ts 的窗口底色、安装包图标的底色是同一个值，改就一起改 */
      html { background: #151518; }
      /* 只给没有外壳时的只读状态页用；外壳挂载后 #root 整个归它。暗底上用亮字 */
      .gwb-report { color: #fafafa; font: 13px/1.6 ui-monospace, Consolas, monospace; padding: 16px 20px; white-space: pre-wrap; }
      .gwb-report ul { padding-left: 1.5em; margin: 0.5em 0; }
      .gwb-report pre { margin: 0.5em 0 0; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const root = document.getElementById('root')
      let currentShell = null
      // 不能用 null：null 是「没有外壳」的推送值，用它当初值会把第一条 url: null 当成重复推送忽略掉
      const NOTHING_BEING_LOADED = Symbol('没有外壳地址在加载')
      // 正在 import、还没挂上的外壳地址：挂上之前 currentShell 还是旧的，靠它认出同一个地址又推来了一次
      let shellUrlBeingLoaded = NOTHING_BEING_LOADED
      let shellGeneration = 0
      let failedShell = null

      function appendTextElement(parent, tagName, text) {
        const element = document.createElement(tagName)
        element.textContent = text
        parent.appendChild(element)
      }

      function entryList(entries) {
        const list = document.createElement('ul')
        for (const entry of entries) appendTextElement(list, 'li', `${entry.id}  ${entry.name}  ${entry.state}`)
        return list
      }

      function appendReportDetails(box, report) {
        appendTextElement(box, 'p', `home：${report.home}`)
        if (report.entries.length === 0) {
          appendTextElement(box, 'p', 'cordis.yml 里一条条目都没有。装一个调用 setShell 的外壳插件并加一条条目，见文档站。')
        } else {
          box.appendChild(entryList(report.entries))
        }
        if (report.errors.length > 0) {
          appendTextElement(box, 'p', '最近的错误与警告（全文在 home 里的 gwb.log）：')
          appendTextElement(box, 'pre', report.errors.join('\n'))
        }
      }

      function showStatusPage(headline, report) {
        root.textContent = ''
        const box = document.createElement('div')
        box.className = 'gwb-report'
        appendTextElement(box, 'p', headline)
        appendReportDetails(box, report)
        root.appendChild(box)
      }

      function disposeCurrentShell() {
        try {
          currentShell?.handle?.dispose?.()
        } catch (err) {
          console.error(`旧外壳 dispose 失败：${String(err)}`)
        }
        currentShell = null
        root.textContent = ''
      }

      async function mountShell(url, report, generation) {
        try {
          await window.gwb.prepareImports()
          if (generation !== shellGeneration) return
          const shellModule = await import(url)
          if (generation !== shellGeneration) return
          if (typeof shellModule.default !== 'function') throw new Error(`${url} 的默认导出不是函数`)
          currentShell = { url, handle: shellModule.default(root) ?? null }
        } catch (err) {
          if (generation !== shellGeneration) return
          failedShell = { url, message: `外壳启动失败：${String(err)}` }
          // 更新提供方到整页刷新之间的正常过渡，不把已知的刷新要求记成启动故障。
          if (!String(err).includes('GWB_IMPORTS_RELOAD_REQUIRED:')) console.error(failedShell.message)
          showStatusPage(failedShell.message, report)
        }
      }

      window.gwb.onShell(async (shell) => {
        const url = shell.url
        // 订阅时请求的一条与去抖推送的一条可能都在 import 完成之前到达，只比 currentShell 的话外壳会挂载两遍
        if (currentShell?.url === url || shellUrlBeingLoaded === url) return
        // error 会触发新的状态报告；同一失败不能再次产生日志，否则形成反馈循环。
        if (failedShell?.url === url) {
          showStatusPage(failedShell.message, shell.report)
          return
        }
        failedShell = null
        shellUrlBeingLoaded = url
        const generation = ++shellGeneration
        try {
          disposeCurrentShell()
          if (url === null) {
            showStatusPage('没有外壳插件（没有插件调用 setShell）。', shell.report)
            return
          }
          await mountShell(url, shell.report, generation)
        } finally {
          if (generation === shellGeneration) shellUrlBeingLoaded = NOTHING_BEING_LOADED
        }
      })
    </script>
  </body>
</html>
